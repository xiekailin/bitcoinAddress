name: Unpublish GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Pages site and gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${{ github.repository }}"
          echo "DELETE /pages"
          curl -sS -D - -o /tmp/pages.body -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$repo/pages"
          echo "--- body ---"
          cat /tmp/pages.body
          echo
          echo "DELETE gh-pages ref"
          curl -sS -D - -o /tmp/ref.body -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$repo/git/refs/heads/gh-pages"
          echo "--- body ---"
          cat /tmp/ref.body
          echo
